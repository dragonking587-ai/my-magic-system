<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GitHub Book Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      margin: 0;
      padding: 24px;
    }
    h1 { margin-top: 0; }
    input, button, textarea {
      font-size: 14px;
      padding: 8px;
      margin: 6px 0;
      width: 100%;
      max-width: 600px;
    }
    button {
      cursor: pointer;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
    }
    button.secondary {
      background: #444;
    }
    textarea {
      height: 300px;
      background: #1a1d24;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
    }
    .file-list button {
      background: #222;
      margin: 4px 0;
      text-align: left;
    }
    .status {
      margin-top: 10px;
      color: #7dd3fc;
    }
  </style>
</head>
<body>

<h1>GitHub Book Editor</h1>

<h3>Repository Settings</h3>
<input id="owner" placeholder="GitHub owner (e.g. dragonking587-ai)" />
<input id="repo" placeholder="Repository name (e.g. my-magic-system)" />
<input id="branch" value="main" placeholder="Branch (main or draft)" />
<input id="root" value="book" placeholder="Root folder (book)" />

<button onclick="setToken()">Set GitHub Token</button>
<button class="secondary" onclick="loadFiles()">Load Book Files</button>

<div class="status" id="status"></div>

<hr />

<div class="file-list" id="files"></div>

<h3>Editor</h3>
<textarea id="editor"></textarea>
<button onclick="saveFile()">Save File</button>

<script>
  const TOKEN_KEY = "gh_editor_token_v1";
  let currentPath = null;

  function setStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  function setToken() {
    const token = prompt("Paste your GitHub fine-grained token:");
    if (!token) {
      alert("Token not set.");
      return;
    }
    localStorage.setItem(TOKEN_KEY, token.trim());
    alert("GitHub token saved.");
  }

  function getToken() {
    return localStorage.getItem(TOKEN_KEY);
  }

  async function githubRequest(url, options = {}) {
    const token = getToken();
    if (!token) {
      alert("Set GitHub token first.");
      throw new Error("No token");
    }
    return fetch(url, {
      ...options,
      headers: {
        "Authorization": "Bearer " + token,
        "Accept": "application/vnd.github+json",
        ...(options.headers || {})
      }
    });
  }

  async function loadFiles() {
    const owner = owner.value.trim();
    const repo = repo.value.trim();
    const branch = branch.value.trim();
    const root = document.getElementById("root").value.trim();

    setStatus("Loading files...");
    files.innerHTML = "";

    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${root}?ref=${branch}`;
    const res = await githubRequest(url);
    const data = await res.json();

    for (const item of data) {
      if (item.type === "dir") {
        loadDir(item.path, owner, repo, branch);
      }
    }
    setStatus("Files loaded.");
  }

  async function loadDir(path, owner, repo, branch) {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
    const res = await githubRequest(url);
    const items = await res.json();

    for (const item of items) {
      if (item.type === "file" && item.name.endsWith(".md")) {
        const btn = document.createElement("button");
        btn.textContent = item.path;
        btn.onclick = () => openFile(item);
        files.appendChild(btn);
      }
    }
  }

  async function openFile(file) {
    currentPath = file.path;
    const res = await githubRequest(file.url);
    const data = await res.json();
    editor.value = atob(data.content);
    setStatus("Editing: " + currentPath);
  }

  async function saveFile() {
    if (!currentPath) {
      alert("No file open.");
      return;
    }

    const owner = owner.value.trim();
    const repo = repo.value.trim();
    const branch = branch.value.trim();
    const content = btoa(unescape(encodeURIComponent(editor.value)));

    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${currentPath}`;
    const res = await githubRequest(url);
    const data = await res.json();

    await githubRequest(url, {
      method: "PUT",
      body: JSON.stringify({
        message: "Edit " + currentPath,
        content: content,
        sha: data.sha,
        branch: branch
      })
    });

    setStatus("Saved: " + currentPath);
  }
</script>

</body>
</html>
